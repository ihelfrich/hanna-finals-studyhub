format:
  html:
    theme:
      light: [cosmo, assets/css/custom.scss]
      dark: [darkly, assets/css/custom.scss]
    include-after-body:
      file: assets/js/keymap-include.html
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    toc-location: right
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: true
    fig-cap-location: bottom
    citation-location: document
    page-layout: full
    grid:
      sidebar-width: 280px
      body-width: 920px
      margin-width: 280px
    fontsize: "1.05rem"
    mainfont: "Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    monofont: "JetBrains Mono, ui-monospace, SFMono-Regular, monospace"
    html-math-method: katex

execute:
  freeze: auto
  echo: false
  warning: false
