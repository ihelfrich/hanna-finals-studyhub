<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a0000"/>
      <stop offset="55%" stop-color="#990000"/>
      <stop offset="100%" stop-color="#c19a00"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" fill="url(#g1)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <!-- Stylized regional lines -->
  <g stroke="rgba(255,199,44,0.22)" stroke-width="1.2" fill="none">
    <path d="M 0 200 Q 300 140 600 180 T 1200 160"/>
    <path d="M 0 220 Q 350 160 700 200 T 1200 180"/>
    <path d="M 0 240 Q 250 180 550 210 T 1200 200"/>
  </g>
  <!-- Actor nodes -->
  <g fill="#FFC72C">
    <circle cx="180" cy="170" r="6"/>
    <circle cx="380" cy="190" r="7"/>
    <circle cx="600" cy="160" r="8"/>
    <circle cx="820" cy="185" r="6"/>
    <circle cx="1020" cy="170" r="5"/>
  </g>
  <g font-family="Inter, sans-serif" fill="rgba(255,255,255,0.62)" font-size="11" text-anchor="middle">
    <text x="180" y="195">Israel</text>
    <text x="380" y="215">Palestine</text>
    <text x="600" y="185">Iran</text>
    <text x="820" y="210">Saudi/Gulf</text>
    <text x="1020" y="195">United States</text>
  </g>
  <!-- Title -->
  <g font-family="Inter, sans-serif" fill="white">
    <text x="60" y="100" font-size="44" font-weight="800" letter-spacing="-0.02em">IR 362 — Politics of the Middle East</text>
    <text x="60" y="135" font-size="20" font-weight="500" fill="rgba(255,255,255,0.88)">Hammad · USC · Spring 2026 · Final Exam (essay-style, 65%)</text>
  </g>
  <!-- Accent bar -->
  <rect x="60" y="60" width="60" height="5" fill="#FFC72C" rx="2"/>
</svg>
