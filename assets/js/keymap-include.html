<script>
/* StudyHub keyboard shortcuts — press ? for help */
(function(){
  if (typeof document === "undefined") return;
  let chord = null, chordTimer = null;
  function rootPrefix(){
    const a = document.querySelector(".navbar a[href$='index.html'], .navbar a[href$='/']");
    if (!a) return "./";
    return a.getAttribute("href").replace(/index\.html$/, "");
  }
  function go(href){ window.location.href = rootPrefix() + href; }
  const targets = {
    h: "index.html", t: "tonight.html",
    i: "ir362/final-run.html", w: "ir362/walkthrough.html", d: "ir362/memorize.html", f: "ir362/index.html",
    s: "ir362/sample-answers.html", c: "ir362/cram-sheet.html",
    a: "acct410x/cheat-sheet.html", e: "econ205/cram-sheet.html",
    m: "marketing/index.html", r: "reset.html"
  };
  function showHelp(){
    let o = document.getElementById("kbd-help-overlay");
    if (o){ o.remove(); return; }
    o = document.createElement("div");
    o.id = "kbd-help-overlay";
    o.innerHTML = `<div class="kbd-help-card"><button class="kbd-close" aria-label="Close">×</button>
      <h3>Keyboard shortcuts</h3>
      <table>
        <tr><td><kbd>g</kbd> <kbd>h</kbd></td><td>Home</td></tr>
        <tr><td><kbd>g</kbd> <kbd>t</kbd></td><td>🎯 Tonight</td></tr>
        <tr><td><kbd>g</kbd> <kbd>i</kbd></td><td>📘 IR Final Run</td></tr>
        <tr><td><kbd>g</kbd> <kbd>w</kbd></td><td>📖 IR Walkthrough</td></tr>
        <tr><td><kbd>g</kbd> <kbd>d</kbd></td><td>💎 IR Memorize Now</td></tr>
        <tr><td><kbd>g</kbd> <kbd>f</kbd></td><td>IR Framework</td></tr>
        <tr><td><kbd>g</kbd> <kbd>s</kbd></td><td>IR Sample Answers</td></tr>
        <tr><td><kbd>g</kbd> <kbd>c</kbd></td><td>IR Cram Sheet</td></tr>
        <tr><td><kbd>g</kbd> <kbd>a</kbd></td><td>📕 ACCT Cheat</td></tr>
        <tr><td><kbd>g</kbd> <kbd>e</kbd></td><td>📗 ECON Cram</td></tr>
        <tr><td><kbd>g</kbd> <kbd>m</kbd></td><td>🛍 Marketing</td></tr>
        <tr><td><kbd>g</kbd> <kbd>r</kbd></td><td>🌬 Reset</td></tr>
        <tr><td><kbd>?</kbd></td><td>Toggle this help</td></tr>
        <tr><td><kbd>Esc</kbd></td><td>Close this help</td></tr>
      </table>
      <p class="kbd-hint">Press <kbd>g</kbd>, then a letter within 1.5s.</p></div>`;
    document.body.appendChild(o);
    o.querySelector(".kbd-close").addEventListener("click", hideHelp);
    o.addEventListener("click", (e)=>{ if(e.target===o) hideHelp(); });
  }
  function hideHelp(){ document.getElementById("kbd-help-overlay")?.remove(); }
  document.addEventListener("keydown", (e)=>{
    const t = (e.target?.tagName || "").toLowerCase();
    if (t==="input"||t==="textarea"||t==="select"||e.target?.isContentEditable) return;
    if (e.key==="Escape"){ hideHelp(); return; }
    if (e.key==="?" || (e.shiftKey && e.key==="/")){ e.preventDefault(); showHelp(); return; }
    if (chord==="g"){
      const k = e.key.toLowerCase();
      if (targets[k]){ e.preventDefault(); go(targets[k]); }
      chord = null; if (chordTimer) clearTimeout(chordTimer);
      return;
    }
    if (e.key.toLowerCase()==="g" && !e.metaKey && !e.ctrlKey && !e.altKey){
      chord = "g";
      if (chordTimer) clearTimeout(chordTimer);
      chordTimer = setTimeout(()=>{ chord = null; }, 1500);
    }
  });
})();
</script>

<script>
/* Scroll-triggered reveal animations — IntersectionObserver, motion-respectful */
(function(){
  if (typeof window === "undefined" || typeof document === "undefined") return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;
  if (!("IntersectionObserver" in window)) return;
  const targets = ".stop, .focus-card, .focus-hero, .countdown-card .item, .quick-tile, .cram-button, .timeline-event, .map-card, .frame-header, .gloss-card, .truth-card, .verification-note, .actor-cell, .scene-pair > div, .lightning, .generate, .do-this, .sample-answer, .q-card";
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("in-view");
        obs.unobserve(e.target);
      }
    });
  }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(targets).forEach(el => {
      el.classList.add("reveal");
      obs.observe(el);
    });
  });
})();
</script>

<script>
/* Wave 24 — interactive enhancements */
(function(){
  if (typeof document === "undefined") return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Top reading-progress bar ----------
  function makeProgress(){
    const bar = document.createElement("div"); bar.id = "sh-progress";
    const fill = document.createElement("div"); fill.id = "sh-progress-fill";
    bar.appendChild(fill); document.body.appendChild(bar);
    function tick(){
      const h = document.documentElement;
      const max = (h.scrollHeight - h.clientHeight) || 1;
      const p = Math.min(100, (h.scrollTop || window.scrollY) / max * 100);
      fill.style.width = p.toFixed(2) + "%";
    }
    let raf = 0;
    window.addEventListener("scroll", () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { tick(); raf = 0; });
    }, { passive: true });
    tick();
  }

  // ---------- Floating toolbar ----------
  function makeFAB(){
    const stack = document.createElement("div"); stack.className = "sh-fab-stack";
    function btn(emoji, title, onclick, key){
      const b = document.createElement("button");
      b.className = "sh-fab"; b.title = title; b.textContent = emoji;
      b.dataset.shKey = key || "";
      b.addEventListener("click", onclick);
      return b;
    }

    // Focus mode
    const focusBtn = btn("⊙", "Focus mode (F)", () => {
      document.body.classList.toggle("sh-focus");
      focusBtn.classList.toggle("active", document.body.classList.contains("sh-focus"));
      try { localStorage.setItem("sh_focus", document.body.classList.contains("sh-focus") ? "1" : "0"); } catch(e){}
      toast(document.body.classList.contains("sh-focus") ? "Focus mode on" : "Focus mode off");
    }, "f");

    // Larger reading
    const largeBtn = btn("Aa", "Larger text (L)", () => {
      document.body.classList.toggle("sh-large");
      largeBtn.classList.toggle("active", document.body.classList.contains("sh-large"));
      try { localStorage.setItem("sh_large", document.body.classList.contains("sh-large") ? "1" : "0"); } catch(e){}
      toast(document.body.classList.contains("sh-large") ? "Larger text" : "Default text");
    }, "l");

    stack.appendChild(focusBtn);
    stack.appendChild(largeBtn);
    document.body.appendChild(stack);

    // Restore state
    try {
      if (localStorage.getItem("sh_focus") === "1") { document.body.classList.add("sh-focus"); focusBtn.classList.add("active"); }
      if (localStorage.getItem("sh_large") === "1") { document.body.classList.add("sh-large"); largeBtn.classList.add("active"); }
    } catch(e){}

    // Keyboard shortcuts for these toggles
    document.addEventListener("keydown", (e) => {
      const t = (e.target?.tagName || "").toLowerCase();
      if (t === "input" || t === "textarea" || t === "select" || e.target?.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "f" && !e.shiftKey) { focusBtn.click(); }
      else if (e.key === "l" && !e.shiftKey) { largeBtn.click(); }
    });
  }

  // ---------- Toasts ----------
  function getToastContainer(){
    let c = document.getElementById("sh-toast-container");
    if (!c) { c = document.createElement("div"); c.id = "sh-toast-container"; document.body.appendChild(c); }
    return c;
  }
  function toast(msg, ms){
    const c = getToastContainer();
    const t = document.createElement("div"); t.className = "sh-toast"; t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => { t.classList.add("fade"); setTimeout(() => t.remove(), 350); }, ms || 1800);
  }
  window.shToast = toast;

  // ---------- Mini confetti ----------
  function confetti(){
    if (reduce) return;
    const canvas = document.createElement("canvas"); canvas.id = "sh-confetti-canvas";
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext("2d");
    const colors = ["#8a2424", "#d4a437", "#8b9d6b", "#a04040", "#c79100", "#6b8e23"];
    const N = 80;
    const parts = [];
    for (let i = 0; i < N; i++) {
      parts.push({
        x: window.innerWidth / 2 + (Math.random() - 0.5) * 60,
        y: window.innerHeight / 2,
        vx: (Math.random() - 0.5) * 12,
        vy: -Math.random() * 14 - 4,
        g: 0.35 + Math.random() * 0.15,
        size: 4 + Math.random() * 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.3,
        life: 0
      });
    }
    let frame = 0;
    function step(){
      frame++; ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = 0;
      parts.forEach(p => {
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;
        if (p.y > canvas.height + 40) return;
        alive++;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, 1 - p.life / 140);
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.restore();
      });
      if (alive > 0 && frame < 200) requestAnimationFrame(step);
      else canvas.remove();
    }
    requestAnimationFrame(step);
  }
  window.shConfetti = confetti;

  // Wire up confetti to existing checkpoint buttons (memorize-checkpoint, walkthrough completion etc.)
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".memo-checkpoint button, .memo-check button, [data-celebrate]").forEach(btn => {
      btn.addEventListener("click", () => { confetti(); toast("✓ Stage cleared", 2200); });
    });
    // Trigger confetti when all walkthrough stops checked
    const walkBoxes = document.querySelectorAll('.stop-complete input[type="checkbox"][data-stop]');
    if (walkBoxes.length) {
      walkBoxes.forEach(box => {
        box.addEventListener("change", () => {
          const all = Array.from(walkBoxes).every(b => b.checked);
          if (all) { confetti(); toast("All stops complete — sleep well", 3500); }
        });
      });
    }
  });

  // ---------- Init ----------
  document.addEventListener("DOMContentLoaded", () => {
    if (!reduce) makeProgress();
    makeFAB();
  });
})();
</script>
